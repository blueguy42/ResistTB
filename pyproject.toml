[project]
name = "genohack"
version = "0.1.0"
description = "ResistTB design library"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "primer3-py", "biopython", "fastapi", "uvicorn", "google-genai", "google-auth", "openpyxl"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
